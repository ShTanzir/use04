name: DiaBo Preview Build

on:
  workflow_dispatch:
    inputs:
      java_code_b64:
        description: 'Base64-encoded MainActivity.java'
        required: true
      xml_code_b64:
        description: 'Base64-encoded activity_main.xml'
        required: true
      build_id:
        description: 'Unique build identifier generated by the DiaBo app'
        required: true

# Prevent two DiaBo builds for the same build_id from racing each other.
concurrency:
  group: diabo-build-${{ github.event.inputs.build_id }}
  cancel-in-progress: false

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # hard cap — a runaway/stuck job should never burn shared Actions minutes
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      # --- Inject the user's code (this is the ONLY step that touches untrusted input) ---
      - name: Decode and inject user code
        run: |
          set -e
          mkdir -p app/src/main/java/com/diabo/preview
          mkdir -p app/src/main/res/layout

          echo "${{ github.event.inputs.java_code_b64 }}" | base64 -d > app/src/main/java/com/diabo/preview/MainActivity.java
          echo "${{ github.event.inputs.xml_code_b64 }}" | base64 -d > app/src/main/res/layout/activity_main.xml

          # Basic size guard — reject absurdly large payloads before they ever reach Gradle.
          JAVA_SIZE=$(wc -c < app/src/main/java/com/diabo/preview/MainActivity.java)
          XML_SIZE=$(wc -c < app/src/main/res/layout/activity_main.xml)
          if [ "$JAVA_SIZE" -gt 200000 ] || [ "$XML_SIZE" -gt 200000 ]; then
            echo "::error::Submitted code exceeds the 200KB safety limit"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: |
          [ -f gradlew ] && chmod +x gradlew || echo "no gradlew present, will use system gradle"

      - name: Build debug APK
        id: build
        run: |
          if [ -f gradlew ]; then ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.event.inputs.build_id }}
          path: |
            **/build/outputs/logs/**
            build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Boot emulator and capture screenshot
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.diabo.preview/.MainActivity
            sleep 6
            adb exec-out screencap -p > screenshot.png

      - name: Upload screenshot artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ github.event.inputs.build_id }}
          path: screenshot.png
          retention-days: 7
